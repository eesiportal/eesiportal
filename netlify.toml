[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/analyze-time-photo"
  to = "/.netlify/functions/analyze-time-photo"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/geocode"
  to = "/.netlify/functions/geocode"
  status = 200
  force = true

[[redirects]]
  from = "/api/site-photo"
  to = "/.netlify/functions/site-photo"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
